[package]
name = "audio-visualizer"
description = """
Simple audio visualization library which is especially useful for developers to visually check audio
samples, e.g. by waveform or spectrum. (So far) this library is not capable of doing nice visualizations
for end users.
"""
version = "0.6.0"
authors = ["Philipp Schuster <phip1611@gmail.com>"]
edition = "2024"
keywords = ["audio", "visualizer", "waveform", "spectrum"]
categories = ["multimedia::audio", "development-tools"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/phip1611/audio-visualizer"
repository = "https://github.com/phip1611/audio-visualizer"
documentation = "https://docs.rs/audio-visualizer/"
exclude = [
    "res",
    "test"
]

[dependencies]
# static chart rendering (PNG/SVG)
charts-rs = { version = "1.0", features = ["png"] }
# live visualization: audio recording + GUI window with plots
cpal = "0.18"
eframe = "0.36"
egui_plot = "0.37"
ringbuffer = "0.16"
# superseded by eframe/egui_plot; removed together with the dynamic module
minifb = "0.28"
# faster compilation: remove unnecessary features
plotters = { version = "0.3", features = ["bitmap_backend", "line_series"] }
plotters-bitmap = "0.3"

[dev-dependencies]
lowpass-filter = "0.5"
spectrum-analyzer = "1.9"
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }

# otherwise FFT and other code is too slow
[profile.dev]
opt-level = 1
